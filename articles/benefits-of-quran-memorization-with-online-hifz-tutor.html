<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-JNFWMKSPQ6"></script>
  

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const pageUrl = encodeURIComponent(window.location.href);

            const pageTitle = encodeURIComponent(
                document.getElementById("article-title").innerText
            );

            document.getElementById("x-share").href =
                `https://x.com/intent/tweet?text=${pageTitle}&url=${pageUrl}`;

            document.getElementById("facebook-share").href =
                `https://www.facebook.com/sharer/sharer.php?u=${pageUrl}`;

            document.getElementById("linkedin-share").href =
                `https://www.linkedin.com/sharing/share-offsite/?url=${pageUrl}`;

            document.getElementById("whatsapp-share").href =
                `https://api.whatsapp.com/send?text=${pageTitle}%20${pageUrl}`;

            document.getElementById("telegram-share").href =
                `https://t.me/share/url?url=${pageUrl}&text=${pageTitle}`;

            document.getElementById("reddit-share").href =
                `https://www.reddit.com/submit?url=${pageUrl}&title=${pageTitle}`;

            const faqQuestions = document.querySelectorAll(".faq-question");

            faqQuestions.forEach((question) => {
                question.addEventListener("click", () => {
                    const answer = question.nextElementSibling;
                    answer.classList.toggle("active");
                });
            });
        });
    </script>

    <a
  href="https://wa.me/201118749237"
  class="whatsapp-float"
  target="_blank"
  rel="noopener noreferrer"
  aria-label="Chat with us on WhatsApp"
  >
  <i class="fab fa-whatsapp"></i>
</a>

</body>
</html>
