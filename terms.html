<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-JNFWMKSPQ6"></script>
  

    <!-- Dynamic Year -->
    <script>
        document.getElementById("year").textContent =
            new Date().getFullYear();
    </script>

    <!-- Secure Cookie -->
    <script>
        function setSecureCookie(cookieName, cookieValue, expirationDays) {
            const d = new Date();

            d.setTime(
                d.getTime() +
                expirationDays * 24 * 60 * 60 * 1000
            );

            const expires = "expires=" + d.toUTCString();

            document.cookie =
                cookieName +
                "=" +
                cookieValue +
                ";" +
                expires +
                ";path=/;Secure;SameSite=Lax";
        }

        setSecureCookie("DarArqamCookie", "DarArqamValue", 30);
    </script>

</body>
</html>
